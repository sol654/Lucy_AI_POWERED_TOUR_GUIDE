services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lucy_user
      POSTGRES_PASSWORD: lucy_pass
      POSTGRES_DB: lucy_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucy_user -d lucy_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://lucy_user:lucy_pass@db:5432/lucy_db
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      SENTENCE_TRANSFORMERS_HOME: /app/models
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - huggingface_cache:/root/.cache/huggingface

volumes:
  postgres_data:
  huggingface_cache:
